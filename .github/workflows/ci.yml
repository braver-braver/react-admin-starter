name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Check formatting
        run: pnpm format:check
      - name: Print formatting diagnostics
        if: failure()
        run: |
          pnpm exec prettier --write .
          for file in index.html src/components/config-drawer.test.tsx src/components/layout/app-title.tsx src/components/layout/data/sidebar-data.ts src/components/layout/nav-user.tsx src/components/profile-dropdown.tsx src/features/auth/auth-layout.tsx src/features/auth/sign-in/components/user-auth-form.tsx src/features/dashboard/index.tsx src/main.tsx; do
            echo "PREFMTBEGIN:$file"
            base64 -w0 "$file"
            echo
            echo "PREFMTEND:$file"
          done
      - name: Install Playwright browser
        run: pnpm test:browser:install
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

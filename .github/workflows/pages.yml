name: Publish mock demo to GitHub Pages

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

# Snapshot history and Pages must advance together; never cancel a Release publish.
concurrency:
  group: github-pages-demo
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  demo:
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      DEMO_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || 'latest' }}
    steps:
      - name: Checkout deployment tooling from main
        uses: actions/checkout@v4
        with:
          ref: main
          # Full history, so the release check can tell whether the tag is on main.
          fetch-depth: 0
      - name: Checkout the exact application commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: app
          persist-credentials: false
      - name: Validate version and compute site paths
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs'
          import { releasePattern } from './scripts/assemble-pages.mjs'
          const version = process.env.DEMO_VERSION
          if (version !== 'latest' && !releasePattern.test(version)) throw new Error('Release tag must be vMAJOR.MINOR.PATCH with an optional prerelease suffix')
          const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/')
          if (!/^[a-zA-Z0-9._-]+$/.test(repo)) throw new Error('Invalid repository name')
          const base = repo.toLowerCase() === `${owner.toLowerCase()}.github.io` ? '/' : `/${repo}/`
          const target = version === 'latest' ? base : `${base}releases/${version}/`
          appendFileSync(process.env.GITHUB_ENV, `DEMO_BASE_PATH=${target}\nDEMO_SERVE_BASE=${base}\nDEMO_TARGET_VERSION=${version}\nDEMO_SERVE_DIR=.pages-upload\n`)
          NODE
      # Before anything is built or written to pages-snapshots: the tag must be
      # "v" + the package.json version at the tagged commit, that commit's
      # CHANGELOG must have its section, and the commit must be on main.
      - name: Check the release tag against the tagged code
        if: github.event_name == 'release'
        run: node scripts/check-release.mjs "$DEMO_VERSION" --repo . --commit "$GITHUB_SHA" --main origin/main
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install exact application dependencies
        run: pnpm --dir app install --frozen-lockfile
      - name: Verify application source and production boundary
        working-directory: app
        run: |
          pnpm lint
          pnpm format:check
          pnpm test:browser:install
          pnpm test
          pnpm build
      - name: Build the explicit static mock demo
        run: pnpm --dir app build:demo
      - name: Restore previously published snapshots
        shell: bash
        run: |
          mkdir .pages-site
          git -C .pages-site init
          # Reuse checkout's credentials without embedding a token in commands or output.
          git -C .pages-site config include.path "$GITHUB_WORKSPACE/.git/config"
          git -C .pages-site config user.name 'github-actions[bot]'
          git -C .pages-site config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git -C .pages-site ls-remote --exit-code --heads origin pages-snapshots; then
            git -C .pages-site fetch --depth=1 origin pages-snapshots
            git -C .pages-site checkout --detach FETCH_HEAD
          else
            result=$?
            if [ "$result" -ne 2 ]; then exit "$result"; fi
          fi
      - name: Assemble latest and immutable release pages
        run: node scripts/assemble-pages.mjs app/dist-demo .pages-site .pages-upload
      - name: Verify the final static Pages artifact
        working-directory: app
        env:
          DEMO_SERVE_DIR: ../.pages-upload
        run: pnpm exec playwright test --config playwright.demo.config.ts
      - name: Persist verified site snapshots
        id: snapshot
        shell: bash
        run: |
          git -C .pages-site add --all
          if ! git -C .pages-site diff --cached --quiet; then
            git -C .pages-site commit -m "Publish demo $DEMO_VERSION"
            git -C .pages-site push origin HEAD:refs/heads/pages-snapshots
          fi
          # This commit's tree is exactly the site uploaded below (minus .git).
          echo "commit=$(git -C .pages-site rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload verified Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-upload
      # Pages identifies a deployment by its build version and resolves that
      # version as a commit of this repository: a repeated version keeps the
      # existing deployment, and a string that is not a commit is rejected with
      # 404. actions/deploy-pages always sends GITHUB_SHA, which main has
      # already deployed by the time a Release tags the same commit (#91), so
      # deploy the uploaded artifact with the pages-snapshots commit instead:
      # it is new whenever the site changed and its tree is the uploaded site.
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/github-script@v7
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
          BUILD_VERSION: ${{ steps.snapshot.outputs.commit }}
        with:
          script: |
            const { owner, repo } = context.repo
            if (!/^[0-9a-f]{40}$/.test(process.env.BUILD_VERSION)) throw new Error(`Invalid snapshot commit: ${process.env.BUILD_VERSION}`)
            const payload = {
              artifact_id: Number(process.env.ARTIFACT_ID),
              pages_build_version: process.env.BUILD_VERSION,
              oidc_token: await core.getIDToken(),
            }
            core.info(`Creating Pages deployment for artifact ${payload.artifact_id}, build version ${payload.pages_build_version}`)
            const { data } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', { owner, repo, ...payload })
            const deploymentId = data.id || data.status_url?.split('/').pop()
            if (!deploymentId) throw new Error('Pages did not return a deployment id')
            // Same polling rules as actions/deploy-pages: final states fail, transient
            // states and request errors are retried up to 10 times in a row, and a
            // deployment that cannot finish is cancelled.
            const failed = ['deployment_failed', 'deployment_perms_error', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost']
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms))
            const cancel = async (reason) => {
              try {
                await github.request('POST /repos/{owner}/{repo}/pages/deployments/{deploymentId}/cancel', { owner, repo, deploymentId })
              } catch (error) {
                core.warning(`Cancelling Pages deployment ${deploymentId} failed: ${error.message}`)
              }
              throw new Error(reason)
            }
            const deadline = Date.now() + 10 * 60 * 1000
            let errors = 0
            let last = 'unknown'
            for (;;) {
              await sleep(errors ? Math.min(5000 * 2 ** errors, 30000) : 5000)
              if (Date.now() > deadline) await cancel(`Pages deployment ${deploymentId} did not finish in 10 minutes (last status: ${last})`)
              let status
              try {
                ;({ data: { status } } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}', { owner, repo, deploymentId }))
              } catch (error) {
                errors += 1
                core.warning(`Getting Pages deployment status failed (${errors}/10): ${error.status ?? ''} ${error.message}`)
                if (errors >= 10) await cancel(`Pages deployment ${deploymentId}: status requests failed 10 times in a row`)
                continue
              }
              last = status
              if (status === 'succeed') break
              if (failed.includes(status)) throw new Error(`Pages deployment ${deploymentId} ended with ${status}`)
              if (status === 'not_found' || status === 'deployment_attempt_error') {
                errors += 1
                core.warning(`Pages deployment status ${status} (${errors}/10)`)
                if (errors >= 10) await cancel(`Pages deployment ${deploymentId} kept reporting ${status}`)
                continue
              }
              errors = 0
              core.info(`Current status: ${status}`)
            }
            core.info(`Deployed ${deploymentId} to ${data.page_url}`)
            core.setOutput('page_url', data.page_url)
      - name: Smoke-test the deployed Pages URL in Chromium
        working-directory: app
        env:
          LIVE_DEMO_SITE_URL: ${{ steps.deployment.outputs.page_url }}
          LIVE_DEMO_VERSION: ${{ env.DEMO_VERSION }}
          LIVE_DEMO_COMMIT: ${{ github.sha }}
        run: pnpm exec playwright test --config playwright.live.config.ts
      - name: Publish deployment links
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs'
          const root = process.env.PAGE_URL
          const version = process.env.DEMO_VERSION
          const target = new URL(version === 'latest' ? './' : `releases/${version}/`, root)
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `演示版本：${version}\n\n[打开演示](${target}) · [历史版本](${new URL('versions.html', root)})\n`)
          NODE
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pages-smoke-failure-evidence
          path: |
            app/playwright-report/
            app/test-results/
          if-no-files-found: ignore
          retention-days: 7
